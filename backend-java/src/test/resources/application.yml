spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:mewtestdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

mew:
  security:
    mode: demo
    demo-subject: MEW-PER-0000
    demo-role: FLEET_READINESS_ANALYST
