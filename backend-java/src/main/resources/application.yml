spring:
  application:
    name: mew-logistics-readiness-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/mewdb;DB_CLOSE_DELAY=-1;MODE=Oracle;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USER:mew_logistics}
    password: ${ORACLE_DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect

---
spring:
  config:
    activate:
      on-profile: jndi
  datasource:
    jndi-name: jdbc/MewLogisticsDS
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect
