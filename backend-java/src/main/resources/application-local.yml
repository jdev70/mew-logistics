mew:
  security:
    mode: demo
    demo-subject: MEW-PER-0000
    demo-role: FLEET_READINESS_ANALYST

spring:
  datasource:
    url: jdbc:h2:file:./data/mewdb;DB_CLOSE_DELAY=-1;MODE=Oracle;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
