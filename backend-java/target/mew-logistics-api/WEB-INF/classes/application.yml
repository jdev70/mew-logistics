spring:
  application:
    name: mew-logistics-readiness-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

mew:
  security:
    mode: jwt

---
spring:
  config:
    activate:
      on-profile: jndi
  datasource:
    jndi-name: jdbc/MewLogisticsDS
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect
